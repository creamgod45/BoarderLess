name: Backend Image

# backend/ 有變更時：測試 → 打包 Docker 映像 → 推送到 GitHub Container Registry
#   ghcr.io/<owner>/boarderless-backend  REST API（容器內 listen 3000）
#   ghcr.io/<owner>/boarderless-worker   背景 worker（素材驗證 / 縮圖，含 ffmpeg）
#
# 映像 tag：
#   分支名稱（main、backend-media-v1…）、sha-<短 sha>、main 另加 latest、
#   推送 backend-v1.2.3 tag 時另加 1.2.3
# pull_request 只測試與 build，不推送。

on:
  push:
    branches: ['**']
    tags: ['backend-v*.*.*']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2

jobs:
  test:
    name: 測試
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: boarderless
          POSTGRES_PASSWORD: boarderless
          POSTGRES_DB: boarderless
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U boarderless"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # S3 端到端測試用；無法連線時測試會自動略過
      object-storage:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: boarderless
          RUSTFS_SECRET_KEY: boarderless-dev-secret
        ports:
          - 9000:9000
    env:
      TEST_DATABASE_URL: postgres://boarderless:boarderless@localhost:5433/boarderless_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 安裝 ffmpeg（素材驗證測試需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: 安裝套件
        run: bun install --frozen-lockfile

      - name: 型別檢查
        run: bun run typecheck

      - name: 測試
        run: bun test

      # 確認映像能啟動、自動 migration、健康檢查通過，再進入推送階段
      - name: 映像啟動檢查
        run: |
          set -euo pipefail
          docker build --target api -t boarderless-backend:ci .
          docker run -d --name api --network host \
            -e PORT=3999 \
            -e DATABASE_URL=postgres://boarderless:boarderless@localhost:5433/boarderless_test \
            -e STORAGE_SIGNING_SECRET=ci-only \
            boarderless-backend:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3999/health/ready; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3999/health/ready > /dev/null
          docker logs api 2>&1 | tail -20
          docker rm -f api

  image:
    name: 映像 ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: boarderless-backend
            target: api
          - name: boarderless-worker
            target: worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登入 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=backend-v(\d+\.\d+\.\d+),group=1
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=BoarderLess backend (${{ matrix.target }})

      - name: Build / Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: 摘要
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "### $NAME"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
