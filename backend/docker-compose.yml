# 本機開發用基礎設施。Redis / object storage 會在 B2/B3 階段加入。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boarderless
      POSTGRES_PASSWORD: boarderless
      POSTGRES_DB: boarderless
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boarderless"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
